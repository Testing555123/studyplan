name: Build Space Image

# 构建 studyplan 的 HF Spaces 形态镜像并推送到 GHCR 公开包。
# Space 仓库只放 `FROM ghcr.io/<owner>/studyplan-space:latest` 的 Dockerfile，不在仓库内构建。
# 触发：推送 v* tag（或手动 workflow_dispatch）。
# 说明见 docs/deploy/huggingface-spaces.md §5.2。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Space image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # owner 与 GitHub 仓库 owner 一致；:latest 供 Space 拉取，:<tag> 用于回滚。
          tags: |
            ghcr.io/${{ github.repository_owner }}/studyplan-space:latest
            ghcr.io/${{ github.repository_owner }}/studyplan-space:${{ github.ref_name }}
          build-args: |
            RUNTIME_FLAVOR=space
            MODELS_PRELOAD=1
            BUILDER_IMAGE=node:24.22.1-slim
            HF_ENDPOINT=
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://studyplan.hf.space' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        # Space 拉取镜像要求包公开；GITHUB_TOKEN 已授权 packages:write。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /user/packages/container/studyplan-space/visibility -f visibility=public
