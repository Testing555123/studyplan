name: CI

on:
  push:
    branches: [v3.0, main]
  pull_request:

# V6：CI 三命令序列（typecheck → test → build）与本地/容器共用同一套 package.json scripts，
# 保证生产入口、本地 compose、默认 dev 指向同一架构。
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: studyplan
          POSTGRES_USER: studyplan
          POSTGRES_PASSWORD: studyplan
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U studyplan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://studyplan:studyplan@localhost:5432/studyplan
      BETTER_AUTH_SECRET: ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # 钉到补丁版：22.23.4 = 2026-10-21 安全发布的 22.x 修复版。
          # 写 `22` 会解析到 runner 缓存里的任意 22.x，可能仍是未修版本。
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build (Next standalone)
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        run: pnpm test:e2e
