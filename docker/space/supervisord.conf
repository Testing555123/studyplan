; HF Spaces 单容器进程编排（supervisord 以 UID 1000 运行，故各 program 不设 user=）。
; 日志统一打到 stdout/stderr，便于在 Space 的 container logs 中查看。
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:postgres]
command=/app/docker/space/postgres-run.sh
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:next]
command=/app/docker/space/start-next.sh
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; 第三方站点 iframe 嵌入代理（services/embed-proxy）：只听 127.0.0.1:3100，
; 由 Next rewrites 转发同构路径（详见 docs/embed-proxy.md）。与 next 无依赖关系，
; 但 priority 低于 next（15<20）使其先启动，缩小冷启动竞态窗口。
[program:embed-proxy]
command=node /app/services/embed-proxy/dist/server/proxy-server.js
directory=/app/services/embed-proxy
environment=PORT="3100",EMBED_PROXY_HOST="127.0.0.1",NODE_ENV="production"
priority=15
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dbbackup]
command=/app/docker/space/backup-loop.sh
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
