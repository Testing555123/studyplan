; HF Spaces 单容器进程编排（supervisord 以 UID 1000 运行，故各 program 不设 user=）。
; 日志统一打到 stdout/stderr，便于在 Space 的 container logs 中查看。
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:postgres]
command=/app/docker/space/postgres-run.sh
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:next]
command=/app/docker/space/start-next.sh
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dbbackup]
command=/app/docker/space/backup-loop.sh
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
