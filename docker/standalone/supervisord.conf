; standalone 形态单容器进程编排（supervisord 以 nextjs 用户运行，故各 program 不设 user=）。
; 双进程：
;   next        —— Web 服务（原 docker-entrypoint.sh 的 standalone 分支逻辑迁入 start-next.sh）
;   embed-proxy —— 第三方站点 iframe 嵌入代理（services/embed-proxy，只听 127.0.0.1:3100，
;                  由 Next rewrites 转发同构路径；详见 docs/embed-proxy.md）
; 日志统一打到 stdout/stderr，便于 docker logs 查看。
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:embed-proxy]
command=node /app/services/embed-proxy/dist/server/proxy-server.js
directory=/app/services/embed-proxy
environment=PORT="3100",EMBED_PROXY_HOST="127.0.0.1",NODE_ENV="production"
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:next]
command=/app/docker/standalone/start-next.sh
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
