# 本地编排：PostgreSQL 16 + pgvector（数据）+ StudyPlan 应用（容器）。
# 单容器单进程铁律：app 容器只跑 node server.js，PG 是独立服务，二者不混。
#
#  启动： docker compose up -d            （构建并启动 app + postgres）
#  停止： docker compose down             （保留数据卷）
#         docker compose down -v          （连数据卷一起删）
#  冒烟： BASE_URL=http://localhost:3000 node scripts/smoke-container.mjs

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studyplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyplan
      POSTGRES_USER: studyplan
      POSTGRES_PASSWORD: studyplan
      # 本地开发：允许宿主通过 TCP 免密连接（dev only）。
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # 宿主本机已有 PostgreSQL 占用 5432，容器发布到 5433 避免冲突（DATABASE_URL 用 5433）。
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyplan -d studyplan"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyplan-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 容器内通过服务名 postgres 访问；宿主调试可用 5433 端口（见上）。
      DATABASE_URL: postgresql://studyplan:studyplan@postgres:5432/studyplan
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
      BETTER_AUTH_URL: http://localhost:3000
      NODE_ENV: production
      # 方案B：权重落 .model-cache，由下方卷挂载注入（避免 pnpm 清空 .cache 丢失）。
      LOCAL_MODELS_ONLY: "1"
      MODEL_CACHE_DIR: /app/.model-cache
    volumes:
      # 本地模型权重持久化（构建期未预下载时为空，运行期由 pnpm models:download 或挂载填充）。
      - model-cache:/app/.model-cache
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  model-cache:
