# 本地开发编排：只需要 PostgreSQL 16 + pgvector。
# 目标态数据库是 PG，不再有 MongoDB（见 docs/DECISIONS.md）。
#
#  启动： docker compose up -d
#  停止： docker compose down          （保留数据卷）
#         docker compose down -v       （连数据卷一起删）

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studyplan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyplan
      POSTGRES_USER: studyplan
      POSTGRES_PASSWORD: studyplan
      # 本地开发：允许宿主通过 TCP 免密连接（dev only）。
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # 宿主本机已有 PostgreSQL 占用 5432，容器发布到 5433 避免冲突（DATABASE_URL 用 5433）。
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyplan -d studyplan"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
